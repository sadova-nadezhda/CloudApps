<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@@title</title>
  <link rel="apple-touch-icon" sizes="180x180" href="@img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="@img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="@img/favicon-16x16.png">
  <link rel="manifest" href="@img/site.webmanifest">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    window.__preloader = (function () {
      // Прелоудер показывается один раз за сутки.
      // Чтобы показывать один раз за сессию (до закрытия вкладки) — поставить TTL = 0.
      var KEY = "cloudapps:preloader-seen";
      var TTL = 24 * 60 * 60 * 1000;

      var store = function () {
        try { return TTL ? window.localStorage : window.sessionStorage; } catch (e) { return null; }
      };

      var seen = false;

      try {
        var box = store();
        var last = box && box.getItem(KEY);
        seen = !!last && (!TTL || Date.now() - Number(last) < TTL);
      } catch (e) { seen = false; }

      if (seen) document.documentElement.classList.add("preloader-off");
      else document.documentElement.classList.add("is-loading");

      return {
        skip: seen,
        mark: function () {
          try {
            var box = store();
            if (box) box.setItem(KEY, String(Date.now()));
          } catch (e) {}
        }
      };
    })();
  </script>
</head>
